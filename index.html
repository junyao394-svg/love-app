<style>
:root[data-theme="cream"]{--bg:#fdf6dc;--card:#ffffff;--ink:#4a3a22;--sub:#9c8760;--soft:#fdf0f4;--line:#f3b8cb;--accent:#f9cfdc;--accent2:#fbe0e8;--on-accent:#e0456f;--scheme:light}
:root[data-theme="dark"]{--bg:#111111;--card:#1a1a1a;--ink:#ffffff;--sub:#e6e6e6;--soft:#232323;--line:#ff5c8d;--accent:#ff5c8d;--accent2:#ff8fb0;--on-accent:#ffffff;--scheme:dark}
:root[data-theme="wine"]{--bg:#F8D5D2;--card:#ffffff;--ink:#3d0c0c;--sub:#8a5a5a;--soft:#f6e3e2;--line:#800000;--accent:#800000;--accent2:#a33a3a;--on-accent:#fff;--scheme:light}
:root[data-theme="mist"]{--bg:#EFEFEF;--card:#ffffff;--ink:#22333a;--sub:#6d8189;--soft:#e8eef0;--line:#88ADBA;--accent:#4f7d8c;--accent2:#88ADBA;--on-accent:#fff;--scheme:light}
:root[data-theme="guava"]{--bg:#FFE0E6;--card:#ffffff;--ink:#4a2a30;--sub:#a17b84;--soft:#FFD0DA;--line:#FF6B85;--accent:#5FA83F;--accent2:#8FCB6B;--on-accent:#fff;--scheme:light}
:root{color-scheme:var(--scheme);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:12.5px/1.55 "PingFang SC","Noto Sans SC",sans-serif}
body{min-height:100vh}
body::-webkit-scrollbar{width:6px}body::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.app{max-width:360px;margin:0 auto;padding:10px 10px 70px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);padding:3px 2px 8px;gap:6px}
.bar svg,.stat svg,h2 svg,.modal .mt svg{width:12px;height:12px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar svg{vertical-align:-2px;stroke:var(--line)}
.hero,.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.name{font-size:15px;font-weight:700}
.lv{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:1px 8px;font-size:11px;font-weight:700}
.track{height:5px;background:var(--soft);border-radius:5px;margin:7px 0 3px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
.small{font-size:11px;color:var(--sub)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}
.stat{background:var(--soft);border-radius:6px;padding:4px 7px;font-size:11px;display:flex;align-items:center;gap:4px}
.stat svg{stroke:var(--accent)}
h2{font-size:12px;margin:12px 2px 6px;display:flex;align-items:center;gap:5px}
h2 svg{stroke:var(--line)}
.task{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:7px}
.task.lock{opacity:.4}.task.done{opacity:.5}
.task.hide{border-width:2px;border-color:var(--accent);background:var(--soft)}
.tt{font-weight:700;font-size:12.5px}.td{font-size:11px;color:var(--sub);margin:2px 0 6px}
.tag{font-size:10px;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
button{font:inherit;font-size:11.5px;border:1px solid var(--accent);border-radius:6px;padding:6px 11px;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:6px}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--line);padding:4px 7px;border-radius:6px;line-height:1;box-shadow:none}
.iconbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.mask.on{display:flex}
.modal{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;max-width:330px;width:100%;max-height:78vh;overflow:auto;white-space:pre-wrap;font-size:12px;line-height:1.75}
.modal::-webkit-scrollbar{width:5px}.modal::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.modal .mt{font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.modal .mt svg{stroke:var(--accent)}
.modal button{margin-top:12px;width:100%}
.foot{display:flex;gap:6px;margin-top:12px}.foot button{flex:1}
.gift{font-size:11px;color:var(--sub);margin-top:6px}
label.f{display:block;font-size:11px;color:var(--sub);margin:9px 0 3px}
input[type=text],input[type=number]{width:100%;padding:7px 9px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:5px;flex-wrap:wrap}.seg button{flex:1 1 30%;background:transparent;color:var(--accent);border-color:var(--line)}.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:5px}
.nodes{display:flex;justify-content:space-between;font-size:10px;color:var(--sub)}
.nodes span.on{color:var(--accent);font-weight:700}
.chk{display:flex;gap:7px;align-items:flex-start;font-size:11px;margin-top:11px}
.swatch{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.swatch button{display:flex;align-items:center;gap:7px;justify-content:flex-start;background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:500;padding:7px 8px}
.swatch button.on{border-color:var(--accent)}
.dot{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.15);flex:none}
#setup{display:none}
</style></head>

const LB={c:["平坦","微隆","小丘","浑圆"],d:["秀气","正常","略大","巨物"],f:["青涩","稚嫩","湿润","熟透"],h:["青涩","稚嫩","湿润","熟透"]};

const WD={c:["平坦的胸口","微隆的胸口","小丘般的胸","浑圆的胸"],d:["秀气的性器","身下的性器","略大的性器","骇人的巨物"],f:["青涩的花穴","稚嫩的花穴","湿润的花穴","熟透的花穴"],h:["青涩的后穴","稚嫩的后穴","湿润的后穴","熟透的后穴"]};

const K="qq_task_v11",TK="qq_theme_v4";

function applyTheme(k){document.documentElement.setAttribute("data-theme",k);try{localStorage.setItem(TK,k)}catch(e){}drawSwatch()}
function curTheme(){return document.documentElement.getAttribute("data-theme")||"cream"}
function drawSwatch(){var el=$("swatch");if(el)el.innerHTML=THEMES.map(t=>'<button class="'+(curTheme()===t.k?'on':'')+'" onclick="applyTheme(\''+t.k+'\')"><span class="dot" style="background:'+t.bg+';box-shadow:inset 0 0 0 3px '+t.line+'"></span>'+t.n+'</button>').join("")}
function openTheme(){drawSwatch();$("tmask").classList.add("on")}
try{applyTheme(localStorage.getItem(TK)||"cream")}catch(e){applyTheme("cream")}
</script>
<script>
const STAR={1:"★",2:"★★",3:"★★★",4:"★★★★",5:"★★★★★",9:"❖ 隐"};
const TIER_EXP={1:40,2:60,3:90,4:130,5:170,9:220};
const POOL={};
["温柔","傲娇","腹黑","高冷","粘人","闷骚"].forEach(function(p){
  POOL[p]={1:[],2:[],3:[],4:[],5:[],9:[]};
});
function padPool(){
  Object.keys(POOL).forEach(function(p){
    [1,2,3,4,5,9].forEach(function(k){
      var a=POOL[p][k];
      while(a.length<6){
        var n=a.length+1;

      }
    });
  });
}
</script>
<script>
/* ================= 温柔 ★（纯爱）1-6 ================= */
POOL["温柔"][1]=[
["★","试探","指尖相碰","在沙发上借着递水碰一碰{ta}的手，不躲开，看{ta}的反应",40,"客厅的灯只开了一盏，暖黄的光落在沙发扶手上，把两个人的影子拉得很近。{me}端着两杯温水从厨房出来，在{ta}身边坐下，把其中一杯递过去。递的姿势很规矩，可指尖擦过{ta}手背的时候，{me}没有像往常那样立刻收回，而是在那一片温热的皮肤上停了一瞬。\n\n{ta}的手指明显顿了一下，杯子停在半空。{ta}抬眼去看{me}，正撞进一双故作镇定的眼睛里。那一瞬间{ta}的呼吸慢了半拍，心里明白过来，却什么都没说，只是把杯子接过去，指腹在杯壁上慢慢摩挲，像是在衡量下一步该走到哪里。杯子里的热气一点点散上来，模糊了两个人的轮廓。\n\n{me}把手收回来，搭在自己膝上，指尖还在发凉——那是紧张的凉，不是冷。脸上若无其事，心跳却早已乱成一团，连电视里在放什么都不知道。{ta}把这一切看在眼里，心里那点笑慢慢沉下去，变成另一种更软的东西。\n\n{ta}放下杯子，身子往这边倾了一点，手臂自然地搁在{me}身后的靠背上，没有真的碰到，可那点距离已经近得让人不敢动。\n\n“再递一次。”{ta}的声音压得很低。\n\n{me}愣了愣，才反应过来{ta}说的是什么，耳根一下子就热了。这一次，两个人的手在杯子上停住，谁都没有先松开。灯下很安静，只有窗外偶尔驶过的车声，和两颗靠得越来越近的心。"],
["★","靠近","肩并肩","把距离缩到最短，故意让{ta}发现自己一直在看",40,"电视开着，画面在两个人脸上明明灭灭，谁都没在看。\n\n{me}坐得离{ta}很近，近到肩膀一动就会碰上去。这个距离是慢慢挪出来的——先是一拃，再是一拳，最后坐到了连呼吸都能听见的地方。{me}的视线好几次黏在{ta}的侧脸上，又飞快地挪开，假装是在追剧情；可剧情演了什么，{me}一个字也说不上来。\n\n{ta}其实早就察觉了，从第一眼就察觉了，只是没拆穿，任由那道目光一遍遍落在自己下颌和喉结上。灯光下{ta}的侧脸线条很柔和，睫毛的影子落在眼下，一颤一颤的。{ta}心里有些发笑，也有一点说不清的软，手指在沙发垫上轻轻敲着，数着{me}看过来的次数。\n\n等到第三次，{ta}忽然侧过头，两个人的视线撞在一起，谁也没有躲开。\n\n{me}的耳朵一下子红了，想转头，被{ta}抬手轻轻按住了下巴。{ta}的拇指在那处摩挲了一下，眼神很安静，也很深。\n\n“想看就好好看，躲什么。”\n\n{me}张了张嘴，一个字都没说出来，只是睫毛颤了颤，乖乖地没有动。{ta}的手一直没有离开，就那么托着，直到电视里换了一集，两个人都没回头看屏幕，只有那点指尖的温度，一直留在下颌上。"],
["★","亲昵","梳头发","替{ta}梳理头发，指尖在耳后多停留一会儿",40,"卧室里只有吹风机低低的声音。{ta}洗完头坐在床边，头发还带着潮气，发梢滴下来的水在肩头洇出小小的深色。{me}拿着梳子站在{ta}身后，从发尾开始，一下一下梳开缠结——动作比平时慢很多，像是不舍得让这一头头发太快理好。\n\n{ta}闭着眼，肩膀慢慢松下来，一天的疲惫被这点耐心磨得所剩无几。{me}的指尖顺着发丝滑到耳后，动作很轻，在那里多停了一会儿，像是被什么绊住了。那一片皮肤薄，温度也高，{me}的指腹能清楚地感觉到下面微微跳动的脉搏。\n\n{ta}心里一动，却没有睁眼，只是呼吸变得格外平缓，把后颈毫无防备地交给身后的人——这份信任本身，就比任何话都说得明白。\n\n梳子放下了。{me}的手改成了直接抚摸，掌心覆在{ta}的发顶上，慢慢往下推，再沿着后颈的线条揉过去，一下，又一下。{ta}终于忍不住轻轻哼了一声，头微微后仰，靠上{me}的腹部，连眉毛都舒展开。\n\n“舒服？”{me}低头问，声音也跟着放轻了。\n\n“嗯。”{ta}答得含糊，声音里带着懒意，尾音软下去。{me}的手就这样一直揉着，房间里安静得只剩两个人的呼吸，谁也没有打破这份安静的意思。"],

["❖ 隐","完整","一整晚","{ta}说今晚不睡了，把人从头吻到脚，再慢慢要",230,"{ta}关灯之前说了一句：“今晚不睡了。”\n\n{me}还以为{ta}在开玩笑。可接下来一整晚，{me}才明白这句话有多认真。\n\n吻是从额头开始的，接着是眉眼、鼻尖、唇角，吻得很闲散，像是不急着到哪儿去。{me}躺在那里，被这样慢慢地吻，从肩膀一直往下吻到指尖，又回来，吻到腰腹、到腿根，每一处都吻到了，唯独在最要紧的地方绕开。\n\n“你故意的。”{me}喘着，声音都软了。\n\n“嗯。”{ta}承认得很干脆，吻落在{me}的大腿上，很轻，“慢慢来。”\n\n{me}被这样磨到后面真有点受不了，抓{ta}的头发，把人往上拉。{ta}才终于压下来，吻{me}的唇，同时慢慢进去。\n\n做的时候也很慢，不赶，{me}每一次要到了什么，{ta}都故意退开半寸，把{me}吊在那里，再重新压回去。{me}被吊了两三回，眼泪都出来了，{ta}低头把眼泪吻掉，才终于给{me}。\n\n后来{me}已经整个人蒸得发软，{ta}却还在旁边，慢慢地吻，慢慢地来。\n\n天快亮的时候，{me}连眼睛都睁不开，声音小得几乎听不见。{ta}最后才停下来，把人搂进怀里，在被角上落了个吻。\n\n“睡吧。”{ta}说，声音也是哑的。\n\n{me}没有应，呼吸已经慢下来了。"]

["★","别扭","谁要你等","嘴上说不用等，却站在门口一直没走",40,"外面下着小雨，{ta}撑开伞，回头问{me}要不要送。\n\n“谁要你送。”{me}回得干脆，脸都仰起来了，“我自己有腿。”\n\n{ta}哦了一声，真的转身走了两步。\n\n{me}在门口站着，手插在兜里，一动没动，眼睛却一直跟着那把伞，跟着走了很远，连自己都没察觉到站得太久。\n\n{ta}走了一段，故意把步子放慢，过了几秒才回头。\n\n{me}立刻把头转开，看向别处，看着墙上的雨水，看得十分认真。\n\n{ta}忍着笑意走回来，把伞往{me}头上一罩：“站这儿干嘛。”\n\n“刚出来，透气。”{me}梗着脖子说，“跟你没关系。”\n\n雨落在伞面上沙沙响。{ta}把伞往{me}那边偏了大半，自己半边肩膀露在外面，被雨打湿了。\n\n{me}憋了一会儿，终于伸手把伞柄往{ta}那边推了推，力气很小，声音更小：“你自己也遮一点。”\n\n{ta}低头看了看被雨打湿的肩，又看了看{me}，笑了一声，什么也没说，只是把伞换了个角度，两个人一起往回走的时候，肩膀始终没有分开过。"],
["★","醋意","谁的消息","看到{ta}手机弹出别人的消息，把脸板起来",40,"{ta}的手机在桌上亮了一下。\n\n{me}扫了一眼那个名字，脸立刻沉了下去，原本正在闲着的手指也停了。\n\n{ta}拿起手机时，注意到旁边那道视线，酸得几乎能闻出来，忍不住笑了一下：“一个同事。”\n\n“我又没问。”{me}回得很有力，视线却还黏在那块屏幕上，眼一眨不眨，像这样盯着那条消息就能看出什么来。\n\n{ta}故意不立刻放下手机，多看了两条。\n\n{me}的脸色又沉了一层。\n\n“看完了吗。”{me}终于开了口，语气平静得反常，反而更明显。\n\n{ta}把手机扣在桌上，转过头来：“吃醋了？”\n\n“谁吃醋。”{me}立刻反驳，坐直了身子，“你要聊就聊，我又不在乎。”\n\n可接下来整整十分钟，{me}一句话都没说。{ta}递过来一杯水，{me}也没接，就放在那儿，最后被{ta}递到嘴边才勉强喝了一口。\n\n{ta}把手机往旁边一推，很轻地说：“那人要加班，问我表格在哪。”\n\n{me}端着水杯，过了好一会儿才闷闷地“哦”了一声，然后抬起眼：“表格在哪。”\n\n“什么？”\n\n“我帮你找。”{me}把杯子放下，说得很快，“反正你也不会找。”"],
["★","较劲","谁先开口谁输","打赌谁先找对方说话，{me}忍到半夜自己先破了功",40,"两个人背对背躺着，谁都不理谁。\n\n起因是谁都不肯先为一句无关紧要的话低头。僵到最后，干脆连话也不说了。{me}背对着，一动不动，赌着一口气，认定要到天亮都不开口。\n\n{ta}其实也没睡，闭着眼，耳朵一直留意着身后那边。\n\n被子动了，床垫轻轻陷下去又弹起来。{me}翻了个身，过一会儿又翻回去。\n\n{ta}心里数着，一次，两次，第三次时终于忍不住睁开了眼。\n\n{me}还背对着，但手臂悄无声息地伸了过来，隔着一小段距离停在半空，没碰到，也没收回去。\n\n{ta}看着那只手，看了很久。黑暗里那只手的轮廓有点模糊，指尖却一直很坚持地悬着。\n\n最后还是{ta}自己转过身，把那点距离补上，抓住了它。\n\n被握住的瞬间，{me}的手指立刻收紧了，嘴上却还闷闷地嘟囔了一句：“……是你先开口的。”\n\n“嗯，我先。”{ta}说。\n\n“……那算你输了。”{me}背对着，声音小得像蚊子。\n\n“我输。”{ta}把手臂往前收，把人往怀里带，“输得很彻底。”{me}没再说话，可后背一点点松了下来，很自然地靠进了{ta}怀里。"],
["★","逞强","我不冷","冻得发抖还坚持说不冷，直到被{ta}拉进怀里",40,"风很大，{me}只穿了一件薄外套，站在路口，脸都吹白了。\n\n“冷不冷。”{ta}问。\n\n“不冷。”{me}把外套的领子拉了拉，下巴抬起来，“这点风算什么。”\n\n话音刚落，一阵风灌进来，{me}的牙轻轻打了个颤，立刻又抿住嘴，装成没事。\n\n{ta}盯着{me}看了一会儿，也不问第二遍，直接伸手把人拉过来，外套往{me}身上一裹，手臂圈住了。\n\n{me}整个人僵在那里，脸腾地红了，抬手推了一下，力气却小得可怜。\n\n“说不用你。”{me}把脸埋在外套里，声音闷闷的。\n\n“我知道。”{ta}说，“是我自己想抱。”\n\n“……那你轻一点。”{me}不吱声了一会儿，才很小声地补了一句，“勒得太紧了。”\n\n可{ta}一松，{me}又自己往里挤了挤，把额头抵在{ta}的肩上，声音压得更低：“……再紧一点也行。”\n\n{ta}没忍住笑了，把人重新圈紧了些，风还在吹，{me}的耳朵却慢慢红了。\n\n“刚才不是说不冷。”\n\n“……闭嘴。”{me}隔着外套捶了{ta}一下，一下很轻，一点也不像真的在生气。"],
["★","掩饰","不是我买的","把买好的东西往{ta}桌上一放，说是随便买的",40,"{me}把袋子放到{ta}桌上，放得有点重。\n\n“给你的。”\n\n{ta}打开看，是{ta}提过一句的那个牌子的笔，颜色还挑的最合手的那种。\n\n“专门买的？”{ta}问。\n\n“谁专门买的。”{me}立刻否认，把脸扭向窗外，“刚好路过，随手拿的。”\n\n“这家店在城南，你上班不顺路。”\n\n“我今天正好去城南办事。”{me}说得很快，说完自己都觉得太急了，补了一句，“别问那么多，不要就还回来。”\n\n{ta}把笔盒往抽屉里放，很小心地放好，然后说：“正好，我缺一支。”\n\n{me}的嘴角动了一下，很快抿住，装作不在意地嗯了一声，转身要走。\n\n走了两步又回来，站在桌边，眼睛看着别处，很不自然地开口：“……用着不对再说。”\n\n“好。”{ta}应得很轻。\n\n“还有。”{me}顿了一下，“这个牌子出了新色，我下周还去。”\n\n{ta}笑了一声：“嗯，等你。”\n\n{me}转身走了，走得很快，可{ta}看见{me}在门口的那一下，脚步明显轻了许多。"]

["★★","别扭","随你","{me}嘴硬让{ta}随便处置，{ta}一说好，{me}又慌了",50,"“随你。”\n\n这三个字{me}说得特别硬气，说完还抱起手臂，一副{ta}能怎么样都无所谓的样子。\n\n{ta}把书合上，放在旁边，抬眼看{me}，慢慢地说：“好。”\n\n{me}愣住了。\n\n{ta}站起身，走过来，站到{me}面前，把{me}的手臂按下来：“那就随我了。”\n\n{me}后退了半步，后背撞到柜子上，退无可退，只能仰着脸看{ta}：“你干嘛。”\n\n“你说的随我。”{ta}很平静。\n\n“……我随口说的。”{me}的声音一下子弱下去，眼睛乱瞟，就是不看{ta}的脸。\n\n“那我当真的听。”{ta}抬手，指尖落在{me}的侧脸上，慢慢往上，停在耳后。\n\n{me}的呼吸一下子就乱了，睫毛也颤得厉害，嘴上还在硬撑：“你别得寸进尺。”\n\n“那你说一句不。”{ta}说得不急不慢，眼神很稳。\n\n{me}张了张嘴，说了一个字，声音轻得自己都听不见：“不。”\n\n“听不见。”\n\n“不……”{me}又说了一遍，第二遍更没底气，说完自己先转开头，耳朵红得彻底。\n\n{ta}笑了一下，把手指收回来：“那就算了。”{me}立刻抬头，瞪了{ta}一眼，那一眼带着点急，可到底什么都没说。"],
["★★","服软","我错了行了吧","吵完架，{me}端着煮好的面在门口磨了半天才开口",55,"两个人吵了一架，{ta}在房间里待着，{me}在厨房待着。\n\n过了半个小时，厨房传来水声、锅铲声。又过了一会儿，{me}端着一碗面站在房间门口。\n\n站了很久，没敲门。\n\n{ta}其实早就听见脚步了，也没出声。\n\n终于，门外传来一声，很轻：“我错了行了吧。”\n\n{ta}没应。\n\n门外安静了几秒，{me}又补了一句，声音更小了：“面要糊了。”\n\n{ta}这才开了门。{me}端着碗站在那儿，脸板着，耳根却红得很，一副委屈又别扭的样子。\n\n“谁错了。”{ta}问。\n\n“……我错的。”{me}说得含含糊糊，眼睛盯着面。\n\n“哪错了。”\n\n“你还要怎样。”{me}终于抬眼，声音有点急又有点气，“我都端着面站这儿了。”\n\n{ta}看着{me}捏着碗沿的手指，都已经红了，忍着笑伸手把碗接过来，往桌上一放，抬手在{me}的头上拍了一下：“行了，进来。”\n\n{me}站着没动，闷闷地说：“那你别不跟我说话。”\n\n“不说了。”{ta}说，把{me}拉进来，关上门。“快吃，凉了。”\n\n{me}这才磨磨蹭蹭地坐下，拿筷子的时候，还偷偷瞟了{ta}一眼。"],
["★★","吃味","别跟他走太近","看到{ta}和别人说笑，{me}把人拽到一边",55,"{ta}和那个人说话的时候，笑得很自然。\n\n{me}远远站在那儿看着，脸一点点板起来，手里的袋子被攥得皱巴巴的。\n\n等那个人走了，{me}过来，一把把{ta}拽到旁边的走廊里。\n\n“干嘛。”{ta}被拽得有点踉跄。\n\n“你跟他很熟？”{me}问，语气平平的。\n\n“同事。”{ta}看着{me}，“在会上认识的，问了点事。”\n\n“问事用得着笑成那样吗。”{me}别开脸，声音闷闷的。\n\n{ta}看了{me}一会儿，忽然笑了。\n\n“你笑什么。”{me}立刻瞪过来。\n\n“笑你。”{ta}说，“现在像个被抢了糖的。”\n\n“谁被抢了。”{me}的脸红了，“我就是觉得你笑得难看。”\n\n{ta}伸手把{me}攥在手边的袋子拿出来，放平，又顺手把{me}攥得发白的拳头抚开：“手都攥成什么样了。”\n\n也许是因为{ta}的手很暖，也许是因为{ta}的声音放得很轻，{me}那股酸劲儿突然就泄了。{me}低着头，很小声地说：“……反正你离他远点。”\n\n{ta}应了一声：“好。”\n\n“还有。”{me}立刻补上，找补似地抬了抬下巴，“这只是提醒你注意分寸，我没别的意思。”\n\n“嗯，没别的意思。”{ta}顺着说，笑得很明显。"],
["★★","试探","你是不是喜欢我","{me}旁敲侧击半天，被{ta}一句直球堵回去",55,"{me}今天特别反常。\n\n一会儿问{ta}周末一般都做什么，一会儿问{ta}以前有没有谈过，问得绕来绕去，绕了半天也没绕到正题。\n\n{ta}一边听一边应，最后终于放下杯子，问：“你到底想问什么。”\n\n{me}顿了一下，眼睛不看{ta}，装作很随意：“就问问。”\n\n“问这么多，不像就问问。”\n\n“那我说直了。”{me}深吸一口气，脸有点红，硬撑着把话说出来，“你是不是……喜欢我。”\n\n说完就后悔了，立刻补了一句，说得又快又急：“我随便问的，你也不用答，就当没说。”\n\n{ta}没打断，也没笑，等{me}说完，才很平静地回：“是。”\n\n{me}整个人僵在那儿，脑子里一片空白，嘴张了张，半天都没说出一个字。\n\n“怎么。”{ta}看着{me}，“问的时候那么大声，现在不说话了。”\n\n“我……”{me}的耳朵红了，视线乱飘，“我又没让你这么直接。”\n\n“你不是问了吗。”{ta}很自然地反问，随即又慢悠悠地补了一句，“那你呢。”\n\n{me}这下连脖子都红了，把脸转过去，好半天才闷闷地挤出一句：“……你自己想。”\n\n“我想不出来。”{ta}说。\n\n“那就慢慢想。”{me}说完就不再开口了，可桌下那只手，不知什么时候已经放到了{ta}的手边上。"],
["★★","靠近","借个肩膀","{me}说只是借一会儿，然后靠了一整路",50,"车上人不多，但也不空，{me}站在{ta}旁边，抓着扶手。\n\n车晃了一下，{me}往前栽了半步，被{ta}伸手扶了一下肩。\n\n“站的稳吗。”{ta}问。\n\n“稳。”{me}嘴硬，可车又晃了一下，{me}再次往前倾。\n\n{ta}没再问，只是往{me}那边让了让。\n\n{me}站着没动，过了一会儿，很小声地开口：“……借一会儿。”\n\n说完就把头靠到了{ta}的肩上，眼睛闭上，不解释，也不看{ta}的表情。\n\n{ta}也没说什么，只是把肩膀调整了一下，让{me}靠得更舒服一点，另一只手很自然地抬起来，虚虚地挡在{me}和人群之间。\n\n车往前开着，一站一站地过。\n\n{me}一直没起来，倒是靠得越来越沉。{ta}低头看了一眼，发现{me}的耳朵还是红的，红得一点都没退。\n\n“到了。”{ta}说。\n\n“再一站。”{me}含糊地说，眼睛都没睁。\n\n“坐过站了。”\n\n“那你叫我。”\n\n{ta}看了看窗外，没再说话，就那么让{me}靠着。到站的时候轻轻推了{me}一下，{me}才不情不愿地直起身，伸了个懒腰，装作什么都没发生过：“走了走了。”"]

["★★★★★","极限","说清楚","{ta}停在里面不动，逼{me}开口求，{me}撑到最后还是说了",175,"{ta}停在里面，不动了。\n\n“说清楚。”\n\n{me}把脸埋在手肘里，不吭声。\n\n{ta}也就一动不动，只是呼吸落在{me}的背上，一下一下，很稳。\n\n时间被拉得极长。{me}整个人都在发抖，被晾在那儿，上不去也下不来，那种难受一点一点磨到顶点。\n\n“你再说一句试试。”{me}终于开口，声音哑得厉害，气也不稳。\n\n“说清楚。”{ta}重复了一遍，语气没变，还多了一点耐心，“想让我怎么弄。”\n\n{me}骂了一句，骂得很轻，一点都不解气，沉默了好一阵，才终于松口，声音小得像从牙缝里挤出来的：“……快一点。”\n\n“快一点做什么。”\n\n“你！”{me}猛地转过头，眼睛红了，瞪了{ta}一眼，那眼里全是气也有水光，“你非得问，非得问，你都——”话说到一半又断掉了，{me}抿住嘴，过了几秒，把脸转回去，声音几乎听不见，“……快点，别磨了。”\n\n{ta}低下头，在{me}的肩后落了个吻：“好。”\n\n之后的那下又快又重，{me}的声音破了一声，立刻咬住嘴，没再松口。{ta}也没让{me}松，只是一次比一次更稳，把{me}那点要强的劲儿一点一点磨干净了。"],
["★★★★★","极限","出声","{me}说不会叫，{ta}偏要逼{me}出声，最后{me}破了功",180,"{me}一直咬着嘴。\n\n从开始到现在，一声都没出，眼睛闭着，抓在枕头上的手指泛白，一副“你说什么我都不会叫”的架势。\n\n{ta}也不急，专挑最难忍的角度，一次比一次准。{me}的呼吸早就乱了，胸口起伏得很明显，可那声还是死死憋着。\n\n“真不出声？”{ta}贴着耳朵问。\n\n{me}摇头，摇得有点僵。\n\n{ta}就没再问。\n\n再后来，{me}的呼吸越来越碎，咬着嘴的牙齿都在打颤，撑到某一下的时候终于松了口，一声完整的呻吟就这么溢出来，{me}自己都愣了一下，随即立刻咬回去。\n\n“听见了。”{ta}说。\n\n“没有。”{me}的声音都变了，还硬着嘴。\n\n{ta}没争，只是一次比一次更重。\n\n{me}没撑多久，第二声、第三声……全漏了出来，一声比一声软，后面干脆不咬了，额头抵在枕头上，随着节奏一声一声地出。\n\n{ta}俯下身，破天荒地没有取笑，只是贴着耳边，说了一句很轻的：“好听。”\n\n{me}被这两个字弄得整个人都僵了一下，脸埋得很深，抬手去推{ta}，推得一点力气都没有。"],
["★★★★★","极限","再来","{ta}没让{me}歇，{me}嘴上骂着，身体却应了",180,"刚结束一次，{me}整个人都软了，趴在床上，腿还在抖。\n\n{ta}的手还在{me}的腰上，没有挪开。\n\n“不行。”{me}的声音闷在枕头里，一点力气都没有，“给我歇会儿。”\n\n“嗯。”{ta}应了一声，手却没走，只是慢慢地揉着。\n\n{me}一开始还挺舒服，可揉着揉着就不对劲了，又被撩起来。{me}扭头瞪了一眼：“你是不是想再来。”\n\n{ta}没答，只是看着{me}，笑了一下。\n\n“我说不行。”\n\n“那你说一声不。”{ta}慢慢地说。\n\n{me}张了张嘴，“不”字都到嘴边了，没出来。\n\n{ta}就俯下身来，动作很轻地又进去了。\n\n{me}闷叫了一声，手抓住了床单。\n\n“你混蛋。”{me}骂得不清不楚，声音全被撞散。\n\n“嗯，我混蛋。”{ta}应得很顺，动作没慢，“还骂。”\n\n“还骂——”{me}又骂了一句，这一句到最后全变成了别的声音。之后{me}就骂不出来了，抓着{ta}的手臂，声音一声比一声软，到最后反而自己往前迎。\n\n{ta}低头吻了{me}的肩，很轻地说：“还说不行吗。”\n\n{me}闭着眼，过了好一会儿，很轻地哼了一声，没答。"],
["★★★★★","极限","别绕","{ta}故意在外面磨，{me}撑到受不了自己开口求",175,"{ta}今晚格外耐心，可耐心到最后，就变成了别的东西。\n\n一直磨着，不进，也不退，就在外面，把{me}的反应用眼睛一点一点地记下来。\n\n“进来。”{me}终于开口，语气很硬。\n\n{ta}没动。\n\n“我让你进来。”{me}又说了一遍，声音小了些。\n\n“求我。”{ta}说。\n\n{me}整个人都僵了一下，脸涨红了，别开眼，咬着嘴不肯开口。{ta}也不催，只是继续慢慢磨，把时间拉得很长。\n\n{me}被磨到后来的声音都在发抖，腿也不受控地想并上，被{ta}按住了。\n\n“……求你。”\n\n{ta}低下头：“没听清。”\n\n“求你！”{me}这次说得很大声，说完立刻闭上眼，脸都埋进枕头里，“你快点，别绕了。”\n\n{ta}这才动了，进去的那一下很稳，{me}整个人都松了，闷叫了一声，随即又咬牙。\n\n“早说就好了。”{ta}的声音落在耳边，很轻。\n\n“你闭嘴。”{me}的眼里都有了水光，可手却抬起来，环住了{ta}的脖子，把这个姿势拉得更近了一些。"],
["★★★★★","极限","天没亮","夜里{me}赌气说不睡，被{ta}当成了一整晚的邀请",180,"“今晚不睡了。”\n\n{me}说得气呼呼的，起因是白天的不痛快，{me}把这句话扔出来，就是想让{ta}哄一哄。\n\n{ta}回答得很干脆：“好。”\n\n{me}当时还没反应过来这个“好”是什么意思。\n\n到了深夜，{me}才明白，{ta}把这句话当了真。\n\n第一次结束时，{me}还嘴硬：“行了，够了吧。”\n\n{ta}没应，只是把{me}翻过来。\n\n第二次结束时，{me}的声音已经哑了：“……我白天说的话不算。”\n\n“算了。”{ta}说，动作没停。\n\n第三次，{me}连话都说不成句了，只能跟着节奏，抓着{ta}的手臂，指节泛白。窗外的天还黑着，房间里只有低低的声音和渐渐平下去的呼吸。\n\n“说好的不睡。”{ta}贴着{me}的耳朵，很轻。\n\n{me}连抬手的力气都没有，声音小得像气音：“……你记这么清楚。”\n\n{ta}笑了一声，吻落在{me}的额角上：“嗯。”\n\n再之后，{me}真的什么都不记得了。\n\n天边泛白的时候，{ta}才把人抱住，用被子裹好，{me}已经睡过去了，脸上还带着一点红。"],
["★★★★★","极限","不装了","{me}逞强说没感觉，{ta}让他自己说清楚到底有没有",180,"“没感觉。”\n\n{me}说得一点也不犹豫，还抬了抬下巴，一副你敢怎么样就怎样的样子。\n\n{ta}没有生气，只是很轻地应了一声：“哦。”\n\n然后{ta}的手慢慢收回来，{me}还没反应过来，就被{ta}换了姿势。\n\n“我刚才可能不够认真。”{ta}说得慢条斯理，“你再说一遍。”\n\n{me}还没开口，就被{ta}那一下弄得差点没忍住。\n\n“说。”\n\n“没——”{me}咬着牙，硬撑着，可第二个字出来的时候已经软了。\n\n{ta}也没再说，只是继续。\n\n几分钟后，{me}的声音已经全乱了，抓着{ta}的肩膀，额头冒汗，下巴也一直仰着。\n\n“还没感觉？”{ta}问。\n\n{me}连摇头的力气都没有，喘了好一会儿，才闷闷地挤出两个字：“……有。”\n\n“有什么。”\n\n“……有感觉。”{me}说得很快，说完就把脸埋进{ta}的颈窝，声音闷得听不清，“别问了，真的别问了。”\n\n{ta}抱着{me}，笑了一声，声音里有点温柔：“下次还嘴硬吗。”\n\n{me}埋在{ta}的颈窝里，过了很久，才闷闷地哼了一声：“……看心情。”"]
];

["❖ 隐","完整","嘴硬到底","{me}嘴上说不在乎，做的时候却抓得最紧",230,"{me}今晚说了很多话。\n\n“也就这样吧。”“谁稀罕。”“你别以为我多想。”一句接一句，说得又轻又快，像赶着什么似的。\n\n{ta}没回嘴，只是听着，一件一件把{me}的衣服褪下去。\n\n衣服褪到手肘的时候，{me}自己也停了一下，瞥了{ta}一眼，见{ta}没有取笑的意思，才又别扭地把手抬起来，让{ta}把袖子抽走。\n\n“你自己说的，就那样。”{ta}这才开口，声音里没人听得出是什么情绪。\n\n“……我也没说不一样。”{me}说得很快，脸红了，别过头去。\n\n{ta}把手贴在{me}的腰侧，慢慢往上，到了胸口停下，什么都不说，就这么看着{me}。{me}被这种安静逼得发慌，越是想找点话堵回去，越是找不出来。\n\n进的时候{me}整个人都绷了，抓着{ta}的手臂，虽然什么也没说，{ta}却看得清楚：{me}的呼吸已经乱了。\n\n“舒服就说。”{ta}低声说。\n\n“还行吧。”{me}咬着嘴，硬撑着。\n\n{ta}就慢下来，一点一点磨，一边磨一边看{me}的脸。{me}的眉头越皱越紧，眼睛也慢慢红了，最后忍不住了，声音从牙缝里漏了出来。\n\n“……你快点。”\n\n“刚才谁说还行。”\n\n“你——”{me}气得很，声音却抖得厉害，“你非得这样。”\n\n{ta}没再逗{me}，低头很重地吻住，动作也快了起来。{me}一下没撑住，手抓得很紧，那双手都开始抖了。\n\n到后面，{me}已经什么都说不出来了，嘴里只剩破碎的音节，脸埋在{ta}的颈窝里，整个人都往{ta}的身上贴。\n\n结束之后{me}还抱着{ta}没松手，呼吸一点点平下来。\n\n“刚才说也就这样。”{ta}在{me}耳边轻声说。\n\n{me}把脸埋得更深，过了很久，才闷闷地回了一句：“……就那样。”\n\n说完自己先忍不住，笑了。"],
["❖ 隐","完整","不看我","{me}全程别着脸，却始终没让{ta}停下",230,"{me}今晚全程都不看{ta}。\n\n脸不是偏向一边，就是埋在枕头里，连{ta}低下头去找{me}的眼睛，{me}都要躲开。\n\n一开始{ta}还以为{me}别扭，后来才慢慢看明白。\n\n因为{me}躲开的那个表情，{ta}已经见过了，是在{me}撑不住的时候。\n\n所以{ta}故意放慢，故意在{me}快要有反应的时候退开一点，把{me}吊着，等着{me}自己忍不住把脸转回来。\n\n“看着我。”{ta}说。\n\n“不看。”{me}闷在枕头里。\n\n“那我停了。”\n\n“……你敢。”{me}的声音一下急了，随即又咬住，把脸偏得更开。\n\n{ta}停了，真的停了，只是很轻地在{me}的耳边呼吸。房间静得能听见{me}自己的喘息。\n\n过了很久，{me}才慢慢把脸转回来一点，眼睛没看{ta}，落在{ta}的下颌上。\n\n“想说什么。”{ta}问。\n\n{me}的嘴唇动了一下，没出声。\n\n“说话。”{ta}低下头，在{me}的唇边停住。\n\n“……你别走。”{me}的声音很轻，很哑。\n\n{ta}才终于动，快而稳。{me}这回没再别开脸，眼睛睁着，看着{ta}，眼里的水光越来越重，最后看不住，才慢慢闭上。\n\n后来{me}也不躲了，连呼吸都和{ta}贴在一起。\n\n结束之后，{me}的眼睛还是红的，{ta}低头亲了亲，很轻地说：“刚才那么看我。”\n\n{me}把脸埋进{ta}的肩，没有说话，只把{ta}抱得更紧了一些。"],
["❖ 隐","完整","赌气","{me}赌气不理人，结果被{ta}一句话弄软了",230,"{me}今天一整天都在赌气。\n\n不理人，说话超不过三个字，问什么都是“行”“哦”“随便”。{ta}也知道为什么，可没去哄——{me}这次要的也不是哄。\n\n到了晚上，{me}还是那副样子，抱着胳膊躺在床上，背对着。{ta}这才靠过去，没有解释，也没有道歉，只是把{me}的腰从后面圈住，一点一点把人往怀里带。\n\n“别碰我。”{me}说，声音平平的，一点力气都没有。\n\n{ta}没被这句话弄退，只是把脸埋在{me}的后颈，很轻地开口：“那就这样，不说话，也不碰。”\n\n{me}没吭声。\n\n过了好一会儿，{me}自己先觉得难受了：被抱着的感觉很实在，可{ta}真的一点都不动，反而更让人受不了。\n\n{me}终于把脸微微转过来一点。\n\n{ta}就懂了，吻落在{me}的侧颈上。\n\n后来的事做得很安静，没有谁说话，只有彼此呼吸的动静。{me}一开始还是别着劲，可{ta}的耐心太好，一点一点磨，磨到最后{me}的眉头松开，抓着{ta}的手也不那么用力了。\n\n“还生气吗。”{ta}贴着耳朵问，声音很低。\n\n{me}没答。\n\n{ta}也就没再问，继续慢慢来。\n\n过了一会儿，{me}自己先开口了，声音闷闷的：“……明天你不许这样。”\n\n“哪样。”\n\n“早上就走。”{me}的声音更小了，“一句不说就走。”\n\n{ta}停下来，在{me}的额角上落了一个吻，很轻地说：“明天等你醒。”\n\n{me}没再说别的，只是把手伸过去，拉住了{ta}的手，一直没松开。\n\n那一晚剩下的时间，两个人做得很慢，也很少说话，只是把那些没说出口的话，都换成了别的方式。"],
["❖ 隐","完整","谁先低头","两个人都倔，最后一起低了头",235,"{me}和{ta}都是不肯先低头的人。\n\n所以吵架之后，两个人都还在硬着，谁也不说话。到了晚上，灯关了，躺在同一张床上，隔着一段距离，各自背过身去。\n\n可谁也睡不着。\n\n过了好一阵，{me}听见{ta}翻了个身，过了一会儿，又翻了一次。\n\n“你睡不着吧。”{me}先出声，声音里还带着点气。\n\n“你也没睡。”{ta}说。\n\n两个人都不吭声了。\n\n再过一会儿{me}翻了个身，正好和{ta}对上了脸，黑着灯，两个人都看不太清，可都知道对方在看着自己。\n\n{ta}先动了，伸手过去，掌心落在{me}的腰侧，只是搭着，没有别的意思。\n\n{me}没有躲。\n\n于是两个人都没再说话，也再没提白天的争执，就那样慢慢地靠在一起。\n\n之后的一切也很安静，动作有点试探，也有点像在道歉，谁也没急。{me}的手一开始还搭在{ta}的后背上，慢慢划着，好像在跟自己较劲。\n\n到后来{me}的呼吸乱了，抓着{ta}的肩膀，眼睛闭上了。\n\n“我今天语气不好。”{ta}忽然说，声音很轻，落在{me}的耳边。\n\n{me}整个人愣了一下，眼睫颤了颤，过了一会儿，才很小声地回：“……我也有点。”\n\n{ta}没笑，只是低头吻了吻{me}的眉心，动作比刚才温柔许多。\n\n到最后两个人几乎是一起到了那一步，{me}的声音抖得不成样子，{ta}把{me}搂进怀里，很紧。\n\n“以后吵完，别一个人待着。”{ta}说。\n\n{me}把脸埋进{ta}的肩窝里，闷了一会儿，才轻轻地嗯了一声。"],

["★★★★★","极限","动一下试试","{ta}把{me}按住，说动一下就重新开始",180,"{ta}把{me}压在床上，从后面扶着慢慢顶进去。\n\n进去得很慢，慢到{me}能清楚地感觉到那根东西一寸一寸撑开自己。{me}的腰忍不住往上抬，被{ta}按住了。\n\n“动一下。”{ta}的声音很低，“就重新开始。”\n\n{me}咬着牙，抓着床单，肌肉绷得死紧。{ta}在里面慢慢地抽出来，又整根顶回去，每一下都磨得{me}想扭腰。{me}憋着不动，憋到后来整个人都在抖。\n\n“不行……”{me}的声音变了调。\n\n{ta}没有停，反倒专门贴着最受不了的那一点，一下一下地撞。{me}终于忍不住往前躲，被{ta}扣住胯拉了回来，撞得更深。\n\n“说了，动一下就重新开始。”\n\n{ta}真的退了出去，然后慢慢地重新进，慢得{me}几乎要疯。\n\n{me}哭了出来，声音全是碎的：“我不动了……我真的不动了。”\n\n{ta}这才低头，在{me}的肩后吻了一下，动作才放开，一次比一次重，把{me}撞得连话都说不出，只剩下断断续续的呻吟和喘息。"],
["★★★★★","极限","全部给我","{ta}掐着{me}的腰，用最深的姿势，一次比一次重",185,"{ta}把{me}的腰托高，膝盖压在{me}腿间，从后面整根撞进去。\n\n“啊——”{me}的叫声连着就断了，双手死死抓着枕头。\n\n{ta}没有给{me}喘息的时间，抽出去大半根，又重重地顶回来，每一下都撞在最深处。{me}的腰被撞得往前一晃，又被{ta}掐着拉回来。\n\n“太深了……不行。”{me}的声音已经哑了。\n\n“忍一下。”{ta}俯下身，胸口贴着{me}的背，热气全落在{me}耳边，“很快就好了。”\n\n“你骗人……”\n\n{ta}确实没停，还把节奏压得更狠，进得更深。每次抽出都会带出一点湿滑的声响，和着撞击的声音在一起。{me}的声音逐渐散成一段一段的，手指抓着床单不断发抖。\n\n到后来{me}连求都求不动了，只能随着{ta}的节奏起伏。{ta}忽然停下，把{me}翻过来，抬起{me}的腿，重新顶进去，正面看着{me}的脸。\n\n“看着我。”{ta}说。{me}睁着眼，眼角湿了，被撞得说不出话。"],
["★★★★★","极限","全部交出来","{me}被做到崩溃，{ta}还贴着耳朵问“还要不要”",185,"{me}已经到过一次，整个人软得像化在床上。\n\n可{ta}只是把{me}翻过来，重新放进来。\n\n“不要了……”{me}的声音很轻，刚说完就被那一下撞得断掉。\n\n“不要了？”{ta}在里面慢慢地磨着，不深，可很慢，顶着最敏感的那一处来回蹭，“那你说停，我就停。”\n\n{me}张着嘴，没说。\n\n“说啊。”{ta}俯下身，气息落在{me}的耳朵上，“说停。”\n\n{me}咬着嘴，眼睛红了。\n\n{ta}贴在{me}耳边，声音压得更低：“不说，就是还要。”\n\n{me}还是没开口。\n\n{ta}就懂了，动作重新快了起来，一次比一次更重。{me}的叫声连着，眼泪从眼角滑进头发里。\n\n“还要吗。”{ta}在耳边问。\n\n“要……”{me}哭了出来。\n\n“要什么。”\n\n“要你继续。”{me}的声音已经不成句子了，“你别停。”\n\n{ta}才低头吻{me}，动作放得更沉、更深。"],
["★★★★★","极限","操开","{ta}把{me}按在衣柜上，从后面操开，一次都没让{me}站稳",185,"{me}刚进卧室，就被{ta}一把按在衣柜上。\n\n还没反应过来，裤子就被扯了下去，{ta}从后面贴上来，扶着那根东西直接顶了进去。\n\n{me}整个人往衣柜上一撞，发出很重的一声，声音也被撞散了。\n\n站都站不稳，{ta}一手在{me}的胸前，一手按在衣柜上，从后面一次一次往里面送，一次比一次深。\n\n“站好。”{ta}贴着{me}的耳朵说。\n\n“站不住……”{me}的手抓着衣柜边缘，指尖都白了。\n\n“那就抓着。”\n\n{ta}的手顺着{me}的背脊往下滑，按在那截腰上，把人固定住。{me}的声音越来越碎，额头抵着衣柜的门板，被撞得轻轻碰响。\n\n“再深一点……”{me}忽然说，声音很轻。\n\n{ta}动了一下，“你说什么。”\n\n“再深一点。”{me}把脸偏过来一点，眼睛湿得不成样子，“全进来。”\n\n{ta}眼神一暗，扣住{me}的腰，把人往后一按，整根操了进去。{me}的一声叫又急又哑，额头在门上抵得更紧。"],
["★★★★★","极限","我说了算","{me}挑逗一整天，{ta}说今晚不会这么轻易放过",185,"“今天撩了我一整天。”\n\n{ta}把{ta}[me]按在床上，声音很慢，一点也不急，“还记得你自己说过什么。”\n\n{me}没说话，只是咽了一口。\n\n“不记得，我帮你回忆。”\n\n{ta}把{me}翻过去，扶着那根东西慢慢顶进去，顶到最深处就停住，然后低头在{me}耳边开口：“早上故意凑那么近。”\n\n{me}喘息着点头。\n\n“中午在我面前弯下腰。”\n\n“我没有……”{me}还想赖。\n\n{ta}退出来，重重地撞回去。{me}的声音一下就断了。\n\n“有。”\n\n“有！”{me}的声音很急，“有，我有。”\n\n“晚上还说困了。”{ta}继续往下，一下比一下重，“跑得掉吗。”\n\n{me}摇头，摇得很急，喘息全乱了。{ta}把{me}的手腕拉住，按在枕头上，动作开始加速，一次比一次深。{me}被撞得快说不完整的话，刚开始还能回一句，到后来就只剩下耳边连续不断的喘息和呻吟。"],
["★★★★★","极限","操到说不出话","{ta}让{me}说清楚今天为什么闹，{me}被操得只剩喘息",190,"“今天为什么闹。”\n\n{ta}一边问，一边往里顶。{me}被那一下撞得说不出话，{ta}问什么，{me}都只能摇着头喘。\n\n“说。”{ta}停下来，慢慢地磨，“不说明白，就一直这样。”\n\n“因为……”{me}喘得厉害，胸口起起伏伏，“因为，你一整天都没看我。”\n\n{ta}的眼神动了一下，“什么。”\n\n“你忙。”{me}的声音轻了下去，“一直在忙，没看我。”\n\n{ta}安静了几秒。然后低头，在{me}的额角上吻了一下，动作忽然变得很轻，慢慢地进，慢慢地退，像是完全换了一种态度。\n\n{me}的眼泪一下子涌了出来。\n\n“哭什么。”{ta}的声音很低，贴着耳朵问。\n\n“不知道。”{me}把脸埋进{ta}的肩窝。\n\n{ta}没再问，只是把{me}抱紧，动作一直很慢地继续，让{me}在怀里一点点平复下来，又在那种慢里一点点失控。\n\n{me}后来哭得已经没有声音了，抓着{ta}的背，只有很轻的抽气。{ta}把人抱得很紧，到最后都没松开，把一声一句都收在耳边。"],

["❖ 隐","完整","钓了一整天","{me}今天撩了一整天，{ta}都记着，晚上一次算清",235,"{me}今天撩了一整天。\n\n早上是在餐桌上，{me}一边喝牛奶，一边把脚伸过去，在{ta}的小腿上慢慢地蹭。{ta}抬眼看了一下，没说话，继续吃早餐。{me}就把脚收回去，装作什么都没做。\n\n中午{me}故意在{ta}面前弯腰去捡东西，慢得很自然，起来的时候还回头看{ta}，笑得一脸无辜。{ta}依然没说什么，只是把杯子放下来。\n\n晚上回家，{me}又说累了，想早点睡。\n\n{ta}这才拦在卧室门口：“今天挺忙。”\n\n“还行。”{me}想绕过去。\n\n“撩了一整天，现在想跑。”\n\n{me}被这一句堵住了，抬头笑得有点虚：“我撩什么了。”\n\n{ta}没答，伸手把人拉进来，放在床上，一件一件把{me}的衣服解开。\n\n进的时候{me}的呼吸全都是乱的，抓着{ta}的手臂，被撑得说不出话。{ta}却偏偏不着急，慢慢地进，慢慢地退，进得不深，只在最容易挑起感觉的地方来回磨。\n\n“今天早上。”{ta}贴着{me}的耳朵说，“蹭我的腿。”\n\n{me}被说得脸更红了，咬着嘴没应。{ta}就重重地顶了一下，{me}闷叫了一声。\n\n“想不想说。”\n\n“……想。”{me}喘着，手在{ta}的背上收紧，“想蹭。”\n\n“中午呢。”\n\n“想给你看……”{me}说不下去了，眼睛发潮，“你非得这样问。”\n\n{ta}笑了一声，才不再折磨{me}，动作放开，一次比一次重。{me}的声音一下就散了，抓着床单，被撞得往前挪，又被{ta}拉回来。\n\n结束之后，{me}整个人都软在{ta}怀里，{ta}在{me}耳边问了一句：“明天还撩吗。”\n\n{me}闭上眼，过了一会儿，闷闷地回：“看心情。”\n\n{ta}低头在{me}的额角上亲了一下。"],
["❖ 隐","完整","道具","{ta}拿出眼罩和手环，说“今晚玩点不一样的”",240,"{ta}从抽屉里拿出两样东西，放在床上。\n\n一条黑色的眼罩，和一对软皮手环。\n\n{me}看了一眼，呼吸慢了下来：“你什么时候买的。”\n\n“很久了。”{ta}说得很平静，“一直没拆。”\n\n“一直放着。”\n\n“等你自己开口。”{ta}看着{me}，“现在还没等你开口，我先问了。”\n\n{me}没说话。{ta}就伸手，指向床上的东西：“想吗。”\n\n{me}沉默了一会儿，点了点头。\n\n{ta}先替{me}戴了眼罩，缎面的内衬贴上来，世界一下子暗了，只剩{ta}的呼吸和手掌。{ta}又拉过{me}的手，一只一只扣上手环，最后把两只手扣在一起，举过头顶。\n\n“紧不紧。”\n\n“还好。”\n\n“不舒服说。”{ta}的声音很轻，随即俯下来，在{me}的唇边开口，“一个字，我就停。”\n\n之后的一切只能靠感觉。{me}看不见，只能听见，只能被摸到。{ta}的吻落在{me}的锁骨、胸口，再沿着一路往下，每一下都让{me}颤一下，更要命的是还在耳边不断地说话，说{me}现在的样子，说{me}有没有好好忍着。\n\n进去的时候{me}整个人绷住了，手指在{ta}扣着的掌心里抓得很紧，声音在黑暗里显得格外清楚。\n\n“疼吗。”{ta}问。\n\n“不疼。”{me}喘着，声音有点发颤。\n\n{ta}开始动，因为{me}看不见，节奏就完全由{ta}说了算。{me}被弄得越发敏感，不知道下一回落到哪里。\n\n“别怕。”{ta}在耳边说，“我在。”\n\n结束的时候{ta}先解的眼镜?眼罩，{me}睁眼，眼睛已经湿了。"],
["❖ 隐","完整","装乖","{me}假装乖了一整周，{ta}说“今天不装了”",230,"{me}装乖装了一整周。\n\n每天按时回家，话不多说，表情安分，连平时那些挑拨的小动作都收了起来。{ta}一开始还挺受用，后来就越看越觉得不对劲。\n\n到了周末晚上，{ta}把人按在沙发上，盯着{me}看了一会儿：“你还要装到什么时候。”\n\n{me}很无辜：“我装什么了。”\n\n“你再装一次试试。”{ta}的声音很轻，手却已经贴着腰侧慢慢往下，“今晚不装了。”\n\n{me}被这句话弄得呼吸乱了一点，还没来得及开口，就被{ta}按进沙发里。\n\n进去的时候{me}的嘴还抿着，被{ta}逼得不得不松口。{ta}动得很慢，却每一下都顶在深处，把{me}那点装出来的乖一点一点磨没。\n\n“现在呢。”{ta}贴着耳朵问，“还要不要装。”\n\n“不装了……”{me}的声音已经软了。\n\n“那是什么。”\n\n{me}张了张嘴，最后还是说了，声音很小：“……想你了。”\n\n{ta}停了一下，低下头看{me}，眼神慢慢变了。之后动作就变了，不再是那种磨人的慢，而是压不住的深。{me}被撞得说不出完整的话，抓着沙发扶手，一下一下往前晃，声音越来越急，到最后只剩断续的喘息和一声接一声的低叫。\n\n结束之后，{ta}把{me}抱在怀里，很轻地说：“以后想我就直说。”\n\n{me}把脸埋进{ta}的胸口，很久之后才应了一声。"],

["★★★★★","极限","只看着{ta}","{ta}让{me}只能看着自己，连眼睛都不许闭上",185,"{ta}让{me}看着自己。\n\n“看着我。”\n\n{me}睁开眼。\n\n“别闭。”{ta}说，“闭一次就停一次。”\n\n{me}咬着嘴，点头。\n\n可这比想象的难多了。{ta}的节奏一起来，{me}就受不了，才睁了一会儿，眼睛就自然地想闭上，被{ta}扣住下巴：“睁开。”\n\n{me}只能又睁开，眼睛红了一圈。\n\n“看我。”{ta}又说了一遍。\n\n{me}被逼着看{ta}的脸，看{ta}的眼睛，看{ta}现在是什么样子。{ta}的脸也开始发红，呼吸乱了，可还是固执地看着{me}。\n\n到后面{me}再也忍不住，眼睛一闭上，{ta}就停了。\n\n“我没让你闭。”\n\n“我不敢看。”{me}的声音都湿了，“你那样看我，我受不了。”\n\n“那就受着。”{ta}低下头，在{me}的眼尾上碰了一下，“再睁开。”\n\n{me}只能又睁开，看着{ta}，眼泪一下滑了下来。"],
["★★★★★","极限","一起疯","今晚{ta}也不克制，和{me}一起疯到了最后",195,"“今晚别忍着。”{ta}说。\n\n{me}愣了一下，这还是第一次听{ta}这么说。\n\n“你也不用忍？”\n\n“不用。”{ta}低下头，声音有点哑，“一起。”\n\n之后真的和平时不一样了。{ta}不再一直压着，动作重了起来，节奏也快，{me}被撞得说不出话，抓着{ta}的肩膀，声音一声一声地漏出来。\n\n{ta}的动作也没有那么稳了，{me}能感觉到{ta}的呼吸落在颈侧，一次比一次乱。\n\n“你……”{me}的声音都断了，伸手捧住{ta}的脸，“你这样，我受不了。”\n\n“受不了就一起。”{ta}亲了一下{me}的手心。\n\n之后整个房间里只剩下两个人的声音，谁也没有再收敛。{me}被这样对待着，到了最后几乎是喊出来的，{ta}也终于没能一直稳下去，把{me}抱得很紧，重重地压了下去。\n\n结束之后，两个人都不说话，只是抱着，{me}依旧挂{ta}身上，{ta}也没推开。过了很久，{me}才贴着{ta}的耳朵，很小声地说：“以后也这样。”{ta}嗯了一声。"],
["★★★★★","极限","不分开","{me}赌气说要跟{ta}一直连在一起，{ta}没让{me}下来",195,"{me}是被赌气的话带着说的。\n\n“那就别分开。”\n\n本来只是嘴上说说，可{ta}真的没让{me}下来。\n\n第一次做完，{me}想退开一点，被{ta}按住了腰。\n\n“说了别分开。”\n\n“我随口说的。”{me}一下急了。\n\n“可我听进去了。”{ta}说得很平静，动作慢慢又动起来。\n\n{me}的声音一下就散了。\n\n之后就一直是那样，{me}整个人坐在{ta}身上，被{ta}抱着，{ta}没退出去过，只是慢慢地动着，把{me}吊在那个最难受的地方。\n\n“你这人……”{me}的声音都没力气了，“怎么这样。”\n\n“是你要的。”\n\n“我那是气话。”\n\n{ta}笑了一声，靠在{me}的耳边：“气话也算话。”\n\n{me}后来连反驳都说不出来，只能抱着{ta}，跟着{ta}的节奏，慢慢被磨到眼泪都出来。到最后{me}整个人都靠在了{ta}肩上，声音几乎听不见：“算了……就这样吧。”\n\n{ta}这才吻了吻{me}的耳后，动作终于重了下来。"],
["★★★★★","极限","哭都不放","{me}哭着求{ta}抱着，{ta}从头到尾都没松手",190,"{me}今晚不知怎么了，一句话都不说，就抱着{ta}不放。\n\n{ta}也没问，从开始就抱着{me}做。\n\n做到一半，{me}忽然哭了，眼泪就掉下来了，没什么声音，就是顺着脸滑下来。\n\n{ta}停下来，抹了{me}的眼角：“怎么哭了。”\n\n“不知道。”{me}的声音很闷，把脸埋进{ta}的肩窝，手臂又收紧了一些，“你抱着我就行。”\n\n“好。”{ta}应得很轻，动作也轻下来。\n\n{me}在怀里哭了一会儿，哭声也断断续续的，后来就变成了一些别的声音，被{ta}的动作一点一点带出来。\n\n“抱着我。”{me}又说了一遍，声音都在抖。\n\n“抱着。”{ta}说，手臂也收得更紧了。\n\n之后直到最后，{ta}都没有松开过。\n\n结束之后，{me}的眼泪还没干，{ta}低着头，一点一点亲{me}的眼角，很耐心。{me}过了一会儿才开口，声音很闷：“我也不知道今天怎么了。”\n\n“没事。”{ta}说，“下次还这样，就还让我抱着。”\n\n{me}没有再说话，只是把脸往{ta}怀里又埋了埋。"]

["❖ 隐","完整","整晚不松手","{me}一进门就挂到{ta}身上，从玄关就抱着做到底",240,"{me}一进门就挂到了{ta}身上。\n\n书包丢在地上，手臂绕上{ta}的脖子，腿也缠住{ta}的腰，整个人抱得严严实实，像已经很久没见了。\n\n“先下来。”\n\n“不下来。”{me}把脸埋进{ta}的颈窝，蹭了一下，“就这样。”\n\n于是{ta}只能抱着{me}走，走到玄关的墙边，{me}也没肯下来。后来谁先动的手也说不清，衣服一件件落在地板上，{ta}把{me}抵在墙上，慢慢扶着进去。\n\n{me}整个人僵了一下，随即把{ta}抱得更紧，声音闷在{ta}的肩窝里。\n\n“还撑着墙？”{ta}低声问。\n\n“不撑，你抱着。”{me}说得很自然，“反正我不下来。”\n\n{ta}笑了笑，居然真的没有把{me}放下来。\n\n{me}被托着，被顶着，一点一点往前走，走到最后几乎是{ta}抱着{me}退回卧室，中途一步都没让{me}落地。\n\n“你倒是很听话。”{me}贴着{ta}的耳朵，声音有点哑。\n\n“不是听话。”{ta}把{me}放到床上，压下去，“是不想放开。”\n\n之后的动作就重了起来。{me}被压着，声音都散开了，手抓着{ta}的肩膀，把人拉得更近。\n\n做完之后{me}还挂{ta}身上，脸埋在{ta}的肩窝里，{ta}也没有推开。\n\n“明天也不许松。”{me}闷闷地说。\n\n“明天再说。”{ta}拍了拍{me}的背。\n\n“不行，你先答应。”\n\n{ta}低下头，在{ta}的头发上碰了一下，很轻地说：“嗯，不松。”"],
["❖ 隐","完整","一起睡","{me}坚持要睡在{ta}怀里，结果被抱着做到了最后",235,"{me}坚持要睡在{ta}怀里。\n\n“你抱我睡。”{me}把被子拉到胸口，说得理所当然。\n\n“躺好。”\n\n“我要在怀里。”\n\n{ta}没办法，只能把手臂张开。{me}就挪了过去，钻进{ta}的怀里，脸贴着{ta}的胸口，手臂环着{ta}的腰，很满意地嗯了一声。\n\n过了一会儿，{ta}才发现{me}并没有要睡的意思。\n\n{me}的手不知道什么时候放到了{ta}的腰侧，贴着，慢慢往上。\n\n“睡觉。”\n\n“睡不着。”{me}说得很坦白，“你先别动。”\n\n“你没打算睡。”{ta}低头看着{me}。\n\n{me}抬起头，笑了一下。之后就没什么可说的了。\n\n{ta}把{me}放平，慢慢地进去。{me}还是不太肯松手，一直抱着{ta}的脖子，被压在身上，声音全落在{ta}的耳边。\n\n“…困了就停。”{ta}在{me}耳边说。\n\n“不困。”{me}的声音已经软了，“你继续。”\n\n{ta}就继续，节奏很慢，做的时候也不急。{me}被这样慢吞吞地对待，反而更受不了，抓着{ta}的手臂，中间好几次声音都断了下去。\n\n做完之后，{me}终于在{ta}的怀里睡了过去，脸埋在{ta}的肩窝里，呼吸很轻。{ta}低头看了看，把被子往上拉了拉，手臂一直没松开。"],
["❖ 隐","完整","离得远","{ta}今晚在沙发上待了一天，{me}被冷到了，晚上一口气全要回来",240,"{ta}今天在沙发上待了一整天。\n\n工作一直没完，饭都是随便吃了两口就回去了，{me}想凑近，{ta}只是摸了摸{me}的头，说“再等等”。\n\n一直等到关灯。\n\n{me}躺到床上，没有说话，背对着{ta}。\n\n过了会儿，{ta}才躺下来，把手放到{me}的腰上。\n\n{me}没理，甚至往里挪了一点。\n\n“生气了。”{ta}说。\n\n“没有。”\n\n“那怎么背对着我。”\n\n{me}过了一会儿才转过来，看着{ta}，说得很直：“你今天看了我两次。”\n\n{ta}愣了一下。\n\n“就两次。”{me}的声音放低了，“一直在电脑那边。”\n\n{ta}沉默了一下，把手伸过去，把人拉近：“那今天补。”\n\n{me}没有挣，可嘴上还是硬的：“怎么补。”\n\n{ta}没有回答，低头下来。\n\n之后就做得过了头。{ta}没有像平时那样慢慢来，进得也比平时重，每一下都深，{me}被撞得说不出话，抓着床单，声音全被打散了。\n\n“够了吗。”{ta}在{me}耳边问。\n\n“不够。”{me}喘着说，手环上{ta}的脖子。\n\n{ta}就继续，动作一下比一下重，直到{me}的声音连不起来，抱着{ta}的背，一句话也说不出。\n\n做完之后{me}还赖在{ta}身上，声音很轻：“明天也要。”\n\n“嗯。”{ta}低头吻了吻{me}的额头，“明天不看电脑了。”"],
["❖ 隐","完整","我要在怀里","{me}把自己塞进{ta}的怀里，从开始到结束都没出来",235,"{me}把自己塞进了{ta}的怀里。\n\n不是那种坐在旁边靠着，是整个人都缩进{ta}的怀里，腿叠在{ta}的腿上，脸贴着{ta}的脖子，手攥着{ta}的衣襟。\n\n“这样怎么动。”{ta}说。\n\n“就这样。”{me}说，“你动就行。”\n\n{ta}于是就把{me}的腿托起来，从这个姿势慢慢进去。\n\n{me}整个人都绷了一下，随即又往{ta}的怀里缩了缩，声音全闷在{ta}的颈窝里。\n\n{ta}动得很慢，因为姿势的关系，每一下都不深，却一直贴着，磨得{me}特别难受，两条腿一直在发抖。\n\n“太慢了。”{me}小声抱怨。\n\n“你选的姿势。”\n\n“那你也太……”{me}的声音一下断了，随即又接着说，“重一点。”\n\n{ta}就重了一点，{me}整个人都往{ta}的怀里缩，声音也变了调。\n\n到后面{me}有一阵子说不出话，只是抱着{ta}的脖子，被{ta}慢慢地磨着，最后几乎是{ta}抱着让{me}上去了。\n\n结束之后，{me}还是那个姿势，脸埋在{ta}的颈窝，不肯动。\n\n“松开了。”{ta}拍了拍{me}的背。\n\n“不要。”{me}说得很倔，“就这样睡。”\n\n{ta}没有再劝，把毯子拉上来，盖住两个人。"],
["❖ 隐","完整","三天没见","{ta}出差回来，{me}一开门就贴上去，三天的话都变成了别的",240,"{ta}出差了三天。\n\n回来的时候已经很晚了。门一开，{me}就站在那儿，什么都没说，直接走过去，抱住了{ta}。\n\n{ta}把箱子放下，手抬起来，也抱住了{me}。\n\n抱了很久，谁都没说话。\n\n“三天。”{me}终于开口，声音闷在{ta}的肩窝里。\n\n“嗯，三天。”\n\n“太长了。”\n\n{ta}低下头，在{me}的头侧碰了一下：“我知道。”\n\n之后的事情都很自然，也没人说话。{ta}把{me}按在沙发上，{me}抱着{ta}的脖子，一直叫{ta}的名字，一声接一声。\n\n“我在。”{ta}每次都答。\n\n{me}被抱着，被顶着，做到后来声音都断了，可还是一直叫着。{ta}低头吻{me}，把那些声音全收了。\n\n到后面{me}开始说些胡话，说让{ta}别走了，说明天也不许去，说得断断续续，{ta}都一一应下。\n\n“你答应了的。”{me}在最后，喘着气说。\n\n“我答应了。”{ta}说完，动作也重了一些。\n\n结束之后，{me}没有松开，还是挂在{ta}身上。\n\n“箱子还没拆。”{ta}说。\n\n“不管了。”{me}把脸埋了进去，“明天再弄。”\n\n{ta}看着怀里的人，没有再说什么，只是把手臂收得更紧了一些。"],
["❖ 隐","完整","一直抱着","{ta}试着放开一点，{me}就立刻钻回去，最后只好一直抱着",240,"{me}今晚一直抱着{ta}。\n\n先在沙发上，再到床上，中间就没松开过。\n\n“我热。”{ta}说。\n\n“我不管。”{me}把脸埋得更深，“你自己说的，可以一直抱。”\n\n{ta}一时也懒得争了。等要做的时候，{me}也是抱着，手环在{ta}的脖子上，腿缠在{ta}的腰上，整个人挂在{ta}身上。\n\n{ta}托着{me}的腰，慢慢地进去，{me}的声音在{ta}的耳边，一下比一下软。\n\n“这样太累了。”{ta}低声说。\n\n“那就累着。”{me}说得很不讲道理。\n\n{ta}也没生气，只是把{me}往上托了一点，动作一次比一次深。\n\n{me}被撞得直往{ta}身上靠，抱得更紧，脸贴着{ta}的脖子，声音全闷在里头。\n\n到了最后{me}整个人都软了，还是没有松手。\n\n“已经结束了。”{ta}贴着{me}的耳朵说。\n\n“我知道。”{me}手臂没有松，“再抱一会儿。”\n\n{ta}就不再说什么，把人放倒在床上，自己也侧躺着，把{me}留在怀里，手一下一下地顺着{me}的背。{me}过了一会儿才闷闷地开口：“今天这样，是不是有点过分。”\n\n“有一点。”{ta}说。\n\n“那你明天还让吗。”\n\n{ta}笑了一下，很低地应了一声：“让。”"]

["★★★★★","极限","整晚的打算","{me}说自己有安排，把{ta}的手腕按在枕头上，做到了底",195,"{me}今晚做了长久的准备。\n\n进房间之前，{me}把灯调暗了，把东西都放在床头，然后看着{ta}：“准备好了吗。”\n\n{ta}还没回答，就被{me}按到床上。\n\n{me}把{ta}的手腕按在枕头上，从上面看着{ta}，说得很淡定：“今晚听我的。”\n\n{ta}看着{me}：“行。”\n\n之后{me}就没有收着了。动作比平时都要重，一次一次往里，把{ta}顶得说不出话，抓着枕头，声音都断了。\n\n{me}一边动一边开口，声音还是那副平稳的样子，可话都是一句一句地往{ta}的耳边说，把{ta}逼得心跳得厉害。\n\n“你今晚说过的。”{ta}在中间喘着说了一句。\n\n“记得。”{me}说，“都记得。”\n\n“记这么多。”\n\n“想了准备了很久。”{me}低下头，在{ta}的唇边停着，“今晚一次用完。”\n\n之后{ta}再没机会接话，{me}的动作一次比一次重，把{ta}牢牢固定在那里，直到最后，{ta}几乎失去了焦点，在他身下开始发抖。"],
["★★★★★","极限","先说话","{me}要在进来之前，听{ta}亲口说愿意，{ta}说了三遍",190,"{me}停在最后一步，没有进去。\n\n“说。”\n\n“说什么。”{ta}喘着。\n\n“说愿意。”{me}的声音很平。\n\n{ta}看着{me}，犹豫了一下，开口：“愿意。”\n\n{me}没动。\n\n“再说一遍。”\n\n“愿意。”{ta}又说了一遍。\n\n{me}还是没动。\n\n“你到底听不听。”{ta}急了，抬手去抓{me}的手臂，“我说了愿意。”\n\n“我知道。”{me}低下头，气息落在{ta}的耳边，“但我刚才没听清。”\n\n“你分明……”{ta}话没说完，被{me}的动作止住了。\n\n之后{me}没有再停，{ta}的声音一下就被撞散，抓着{me}的肩，被带动着往前一晃。\n\n“再说一遍。”{me}在耳边开口。\n\n“愿意。”{ta}的声音已经变了。\n\n“又说了一遍。”{me}的动作沉下去，声音也跟着低下来，“我记着。”\n\n{ta}没能接话，被撞得只能抓得更紧，把脸埋进{me}的肩窝，声音全闷在里边。"],
["★★★★★","极限","看着{ta}","{me}要求{ta}在全过程中不许闭上眼睛，一次都没让",195,"“睁眼看着我。”\n\n{me}今晚说了这一句，然后就一直盯着{ta}。\n\n{ta}被看得受不了，才闭上没多久，{me}就停了。\n\n“睁开。”\n\n{ta}只好又睁开，眼里都已经湿了。\n\n“你太折磨人了。”{ta}的声音都在抖。\n\n“我只是在看着你。”{me}说得很平静，动作却没停，“你看我，我就继续。”\n\n{ta}只能看着{me}，一次也没有再把眼睛闭上。时间越长，那种被看得无处可躲的感觉就越发明显——{me}的动作、{me}的呼吸、{me}额头上的那层汗，全都在{ta}看得见的地方。\n\n到后面{ta}终于还是没能忍住，眼睛闭上的一瞬，眼泪就跟着下来。\n\n{me}停了下来，看到那滴眼泪，动作一下就轻了，低下头很轻地把那一点吻掉。\n\n“不逼你了。”{me}说得很低，“可以闭了。”\n\n{ta}却反而把眼睛睁开了，看着{me}，抬手把人拉下来，吻了上去。"],
["★★★★★","极限","一句也不停","{me}今晚一句话都没停，{ta}被迫说到最后",195,"{me}今晚的话格外多。\n\n本来话很少的人，只是这种情况更少，可今天从进来开始，就没停下来过。\n\n“这样。”\n\n“疼吗。”\n\n“这里。”\n\n{ta}被问得受不了，抓着手边的被角，声音都碎了：“你别说那么多。”\n\n“那你告诉我，我该说多少。”{me}的动作没停。\n\n“一句也别说了。”\n\n“好。”{me}答了，之后真的就没再说话。\n\n可这样一来，反而更让人受不了——没了那些声音以后，剩下的只有动作，还有两个人越来越乱的呼吸。\n\n{ta}被这样的沉默折腾得厉害，到最后反而是自己忍不住开了口，一声一声的叫，叫得{me}都停了下来，低头看着{ta}。\n\n“刚才说的是谁。”{me}的声音也很哑。\n\n“我。”{ta}闭上眼，声音很小，“我受不了了。”\n\n{me}才低下头，在{ta}的唇上碰了一下，动作重新加重，也终于又开口了，一句一句，说得{ta}再没能要求{me}停下。"],

["❖ 隐","完整","写得清清楚楚","{me}把折好的纸递过去，上面写的是今晚想做的每一件事",245,"{me}把一张折好的纸递过来。\n\n{ta}展开，看了一眼，随即抬起头，又低下头继续看。信上是{me}的字，一行一行写得很规整，标了点号，一条都没有落下，后面还留了空白，写着“如果你觉得有哪条不合适，可以划掉”。\n\n{ta}看了很久，才开口：“你什么时候写的。”\n\n“前几天。”{me}坐在那儿，姿势很正，表情跟平时说工作的时候差不多，“想了很久才写清楚。”\n\n“写完还留着让我划掉。”\n\n“得让你知道。”{me}说得很平，“不然我不知道你到哪儿是可以的。”\n\n{ta}把纸折起来，放在床头，转过身看着{me}，很轻地说了一句：“一条都不用划。”\n\n{me}的耳朵一下就红了，可他只是点了点头：“那就按写的来。”\n\n之后就真的照着纸上写的做了。\n\n{ta}把{me}按到床上，衣服一件一件脱下来，接着是上面写的第一步、第二步，做得很慢。{me}躺在那里，一直看着{ta}，眼神一点都没躲，可呼吸越来越乱，手在床单上慢慢收紧。\n\n“这样对吗。”{ta}低头问。\n\n“对。”{me}的声音有点哑。\n\n进去的时候{me}的眉心皱了一下，{ta}立刻停住，等{me}自己把呼吸放平，才继续往里。整个过程都按着那张纸上写的来，慢慢地，一步一步。\n\n到后面那张纸上写的已经做到了第三项，{me}的声音已经不成句子了，{ta}忽然低声问：“最后一条，还写吗。”\n\n{me}微微睁开眼，过了一会儿，很轻地点了一下头。\n\n{ta}就低下头，在{me}耳边说了一句，然后把动作放得更重。之后的很长一段时间里，{me}一句话都说不出来，只余喘息。"],
["❖ 隐","完整","喝了一点酒","{me}酒量很差，喝了两杯就靠在{ta}肩上，说了一句心里话",240,"{me}今晚喝了两杯酒。\n\n本来打算只喝一杯，可被劝着劝着就超了。到最后{ta}回头看{me}的时候，{me}已经靠在沙发背上，脸有点红，眼睛也有点钝。\n\n“回去吧。”{ta}说。\n\n{me}摇了摇头，过了一会儿，忽然开口：“我今天。”\n\n“嗯。”\n\n“有点想离你近一点。”\n\n{ta}愣了一下，低头看{me}。{me}靠在那儿，眼睛半闭着，说得很自然，一点都没觉得这句话有什么。\n\n“喝多了。”{ta}说。\n\n“没有。”{me}摇头，摇得很缓慢，“两杯，我清楚。”\n\n{ta}看着他，没再说什么，把人扶起来，带回家。\n\n到家之后{me}已经有点撑不住了，靠在{ta}的身上，被扶上床。{ta}本来打算只是脱外套，帮{me}躺好，可{me}一直拉着{ta}的衣角不放。\n\n“别走。”\n\n“我在。”\n\n{me}这才松了点劲，眼睛睁开来一点，看着{ta}，声音很低：“你要是觉得我喝多了不算数，那就等我清醒。”\n\n{ta}的手停在{me}的腰侧，看了一眼{me}的脸，过了一会儿才问：“现在想吗。”\n\n{me}点头，点得很清楚。\n\n{ta}沉默了一下，才低下头，很慢地凑近。之后的一切都发生得很慢，{ta}脱掉{me}的衣服，动作比平时都轻，慢慢地进，也很克制，每一下都留着余地，时不时停下来，看{me}的反应。\n\n{me}被这样对待着，起初还撑着，后来就慢慢软了，话也不像刚才那么有条理，只剩一些很轻的应答，混着呼吸。\n\n“醒着吗。”{ta}凑到{me}的耳边问。\n\n“醒着。”{me}的声音很轻。\n\n{ta}的动作快了一些，{me}抓着{ta}的手臂，声音全散了，到最后整个人都软在{ta}的怀里。\n\n醒来的时候已经快中午了，{me}躺在床上，看了{ta}一会儿，才开口：“昨晚我说的话，算数。”{ta}嗯了一声。"],
["❖ 隐","完整","都写在脸上了","{me}以为掩饰得很好，{ta}说“你写在脸上了”",240,"{me}从下午起就不太对劲。\n\n话少了一点，做事的路子也乱了，手里看着东西，眼神却一直往{ta}这边飘。\n\n{ta}看得挺清楚，就是一个字没说，等到晚上收拾完，才走过去，在{me}旁边坐下：“你今天有心事。”\n\n“没有。”{me}说得很稳。\n\n“有。”{ta}说，“从下午起就有了，一直写在脸上。”\n\n{me}抬起眼看了{ta}一下，过一会儿才把视线错开。\n\n“在想什么。”{ta}凑近一点。\n\n“在想……”{me}停了好一会儿，才把话说出来，“在想怎么开口。”\n\n“开什么口。”\n\n{me}深深地吸了一口气，说得很直接，也很平静：“我想跟你做。”\n\n{ta}被这句话噎了一下，随即笑了：“就这一句，你要想一下午？”\n\n“要。”{me}答得很认真，“怕说得太直接。”\n\n“现在这样不直接？”\n\n“已经是整理过的了。”\n\n{ta}没忍住，笑得肩膀都在动。{me}皱起眉：“你笑什么。”\n\n“没笑你。”{ta}抬手在{me}的后颈上按了一下，把人拉近，“笑我竟然等了一下午。”\n\n之后就没什么可说的了。{ta}把{me}按在沙发上，衣服被一件件褪下来。{me}还是那副表情，可身子已经在{ta}手下软了，呼吸也乱。{ta}放进去的时候{me}闷了一声，手臂绕在{ta}的后颈，收得很紧。\n\n“你还挺会使劲的。”{ta}贴着{me}的耳朵，“一下午就想这个了。”\n\n{me}没答话，只是抬手把{ta}的嘴按住了。{ta}拉开那只手，动作也重了下去。{me}的声音一下就散了，抓着{ta}的肩膀，被带动着往{ta}怀里贴。"],

function show(t,b){$("mt").textContent=t;var m=$("mb");m.textContent=b;m.style.whiteSpace="pre-wrap";m.style.lineHeight="1.8";$("mask").classList.add("on")}

function seg(id,arr,get,set){var el=$(id);el.innerHTML=arr.map(function(a){return '<button type="button" class="'+(get()===a?"on":"")+'" data-v="'+a+'">'+a+'</button>'}).join("");el.onclick=function(e){var v=e.target.getAttribute&&e.target.getAttribute("data-v");if(!v)return;set(v);drawSetup()}}
function drawSetup(){var d=S.draft;if(d.g!=="男")d.g="双性";
seg("gSeg",["男","双性"],function(){return d.g},function(v){d.g=v});

seg("pSeg",PERS,function(){return d.pe},function(v){d.pe=v});
var ks=SZK[d.g]||SZK["男"];
$("sliders").innerHTML=ks.map(function(k){var v=d.sz[k]||0;return '<label class="f">'+NM[k]+'</label><div class="ax"><input type="range" min="0" max="3" step="1" value="'+v+'" data-k="'+k+'"><div class="axw">'+LB[k].map(function(w,i){return '<span data-i="'+i+'"'+(i===v?' class="on"':'')+'>'+w+'</span>'}).join("")+'</div></div>'}).join("");
$("sliders").oninput=function(e){var k=e.target.getAttribute("data-k");if(!k)return;var v=+e.target.value;d.sz[k]=v;var sp=e.target.parentNode.querySelectorAll(".axw span");for(var n=0;n<sp.length;n++)sp[n].className=n===v?"on":""};
$("sliders").onclick=function(e){var s=e.target;if(!s.hasAttribute||!s.hasAttribute("data-i"))return;var r=s.parentNode.parentNode.querySelector("input");r.value=s.getAttribute("data-i");r.dispatchEvent(new Event("input",{bubbles:true}))}}
function showSetup(){$("setup").style.display="block";$("game").style.display="none";if(S.p){$("pn").value=S.p.n;$("tn").value=S.p.t}drawSetup()}
function genToday(){var b=Math.min(5,1+Math.floor((S.day-1)/2)),lo=Math.max(1,b-1),hi=Math.min(5,b+1),tr=[lo,lo,b,b,hi,hi],used={},out=[];
tr.forEach(function(k){var ix=[];pool()[k].forEach(function(x,i){if(x[1]!=="待写")ix.push(i)});
var fresh=ix.filter(function(i){return S.sat.indexOf(k+"_"+i)<0&&!used[k+"_"+i]});
var c=fresh.length?fresh:ix.filter(function(i){return!used[k+"_"+i]});if(!c.length)return;
var i=c[Math.floor(Math.random()*c.length)];used[k+"_"+i]=1;out.push([k,i])});
S.today=out;var h=pool()[9],hx=[];h.forEach(function(x,i){if(S.usedHide.indexOf(i)<0)hx.push(i)});
if(!hx.length){S.usedHide=[];hx=h.map(function(x,i){return i})}
S.hideIdx=hx[Math.floor(Math.random()*hx.length)]}
function doneCount(){return S.today.filter(function(a){return S.sat.indexOf(a[0]+"_"+a[1])>=0}).length}
function card(a,hid){var t=pool()[a[0]][a[1]],key=a[0]+"_"+a[1],done=S.sat.indexOf(key)>=0,act=S.cur.indexOf(key)>=0,lock=hid&&doneCount()<3;
var btn=done?'<button disabled>已完成</button>':lock?'<button disabled>完成今日三项后解锁</button>':act?'<button data-a="fin" data-k="'+key+'">完成</button>':'<button data-a="acc" data-k="'+key+'">接取</button>';
return '<div class="card"><div class="row"><b>'+T(t[2])+'</b><span class="small">'+t[0]+' '+t[1]+'</span></div><div class="small" style="margin:4px 0 8px">'+(lock?"？？？":T(t[3]))+'</div><div class="row"><span class="small">+'+t[4]+' EXP</span>'+btn+'</div></div>'}
function render(){var p=S.p,L=lvl(),e=S.exp%500;
$("pname").textContent=p.n;$("lv").textContent="Lv."+L;$("pinfo").textContent=p.g+" · "+p.pe+" ｜ 攻略："+p.t;
$("fill").style.width=(e/5)+"%";$("exp").textContent="EXP "+e+"/500";
$("next").textContent=GIFTS[L-1]?"下一礼品："+GIFTS[L-1]:"礼品已全部解锁";
$("st1").textContent="第 "+S.day+" 天";$("st2").textContent="今日 "+doneCount()+"/"+S.today.length;$("st3").textContent="累计 "+S.sat.length+" 条";$("st4").textContent="背包 "+S.bag.length+" 件";
$("dayT").textContent="第 "+S.day+" 天任务（可拒绝）";
$("list").innerHTML=S.today.map(function(a){return card(a,false)}).join("")+card([9,S.hideIdx],true);
$("bag").innerHTML=S.bag.length?S.bag.map(function(g){return '<div class="card"><div class="row"><b>'+GN[g]+'</b><button data-a="open" data-k="'+g+'">'+(S.open.indexOf(g)>=0?"再看一次":"打开")+'</button></div></div>'}).join(""):'<div class="small">背包是空的，升到 Lv.2 获得第一件礼品。</div>'}
function fin(key){var a=key.split("_"),k=+a[0],i=+a[1],t=pool()[k][i],b=lvl();
S.cur=S.cur.filter(function(x){return x!==key});S.sat.push(key);if(k===9)S.usedHide.push(i);S.exp+=t[4];
var s="完成："+T(t[2])+"　+"+t[4]+" EXP\n\n"+T(t[5]),n=lvl();
if(n>b){s+="\n\n升到 Lv."+n+"！";for(var L=b+1;L<=n;L++){var g=L-2;if(g>=0&&g<GN.length&&S.bag.indexOf(g)<0){S.bag.push(g);s+="\n获得礼品【"+GN[g]+"】，已放进背包。"}}}
save();render();show("任务完成",s)}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button[data-a]");if(!b)return;var a=b.getAttribute("data-a"),k=b.getAttribute("data-k");
if(a==="acc"){S.cur.push(k);save();render()}else if(a==="fin")fin(k);else if(a==="open"){var g=+k;if(S.open.indexOf(g)<0)S.open.push(g);save();render();show("打开："+GN[g],T(GS[g]))}});
function showGame(){$("setup").style.display="none";$("game").style.display="block";render();tick()}
function tick(){var d=new Date();$("clock").textContent="第 "+S.day+" 天 · "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);$("loc").textContent="家 · 卧室"}
setInterval(function(){if(S.p)tick()},30000);
window.startGame=function(){var n=$("pn").value.trim(),t=$("tn").value.trim();
if(!n||!t){alert("请填写两个名字");return}if(n===t){alert("两个名字不能相同");return}
if(!$("adult").checked){alert("请先确认已年满 18 岁");return}
var d=S.draft;S.p={n:n,t:t,g:d.g,r:"受",pe:d.pe,sz:JSON.parse(JSON.stringify(d.sz))};
if(!S.today.length)genToday();save();showGame()};
window.nextDay=function(){S.day++;S.cur=[];genToday();save();render();tick();window.scrollTo(0,0);show("第 "+S.day+" 天","新的一天，今日任务已刷新，难度会比昨天更高一点。")};
window.editP=function(){var d=S.draft;if(S.p){d.g=S.p.g;d.r=S.p.r;d.pe=S.p.pe;d.sz=JSON.parse(JSON.stringify(S.p.sz))}showSetup()};
window.reset=function(){if(!confirm("确定重开？进度会清空"))return;S.day=1;S.exp=0;S.sat=[];S.cur=[];S.bag=[];S.open=[];S.today=[];S.usedHide=[];S.hideIdx=-1;S.p=null;try{localStorage.removeItem(K)}catch(e){}showSetup()};
try{if(S.p){if(!S.today.length)genToday();showGame()}else showSetup()}catch(e){showSetup()}
})();
</script>
</body></html>
